name: shellcheck

on:
  pull_request:
    paths:
      - 'multitenant-tooling/**/*.sh'
      - '.github/workflows/shellcheck.yml'
  push:
    branches:
      - main
      - multitenant-poc
    paths:
      - 'multitenant-tooling/**/*.sh'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck on multitenant-tooling
        # -S warning: gate on real bugs, skip style-only findings.
        # -x: follow `source` directives so lib/*.sh is analysed as part
        #     of the calling script's context.
        # Exclude codes: SC1090 (dynamic sources, we do a lot of that
        # for secrets.env and per-tenant config) and SC1091 (source
        # follows target only when available; on CI, /usr/local/share/…
        # is absent).
        run: |
          shopt -s globstar nullglob
          shellcheck \
            -S warning \
            -x \
            -e SC1090,SC1091 \
            multitenant-tooling/**/*.sh
